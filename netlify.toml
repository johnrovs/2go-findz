[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router client-side routing: without this, Netlify's static file server
# returns its own 404 for any nested route requested directly (e.g. a hard
# refresh on /buying-guides/some-slug) instead of loading the SPA, which then
# renders the app's own client-side routes (including its own NotFoundPage for
# genuinely unmatched paths).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
